services:
  db:
    image: postgres:16
    container_name: cd-generator-db
    environment:
      - POSTGRES_DB=cd_generator
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - ./db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    restart: always

  generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cd-generator
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/cd_generator
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - EUREKA_CLIENT_ENABLED=false
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    ports:
      - "9903:9903"
    depends_on:
      - db
    restart: always
